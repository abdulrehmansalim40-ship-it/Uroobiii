<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Urooba 💖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg1:#ffe3ec;--bg2:#ffc2d6;--card:#fffafcee;--ink:#6b1a3a;--accent:#e8386d;--accent2:#ff7aa2;--soft:#a8416a;--pol:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0a18;--bg2:#4a1230;--card:#3a1226ee;--ink:#ffe3ec;--accent:#ff5c8a;--accent2:#ff8fb0;--soft:#ffb3cb;--pol:#fff0f5}}
:root[data-theme="dark"]{--bg1:#2a0a18;--bg2:#4a1230;--card:#3a1226ee;--ink:#ffe3ec;--accent:#ff5c8a;--accent2:#ff8fb0;--soft:#ffb3cb;--pol:#fff0f5}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;padding:16px;overflow-x:hidden}
.card{position:relative;z-index:2;background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:24px 20px 28px;max-width:400px;width:100%;margin:auto;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - 32px);box-shadow:0 20px 60px #e8386d44}
.pol{background:var(--pol);padding:10px 10px 12px;border-radius:6px;box-shadow:0 8px 22px #0003;width:min(250px,70%);margin:0 auto 16px;transform:rotate(-3deg);transition:transform .4s}
.pol:nth-child(even){transform:rotate(3deg)}
.pol img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px}
.pol span{display:block;color:#6b1a3a;font-family:"Nunito",system-ui,sans-serif;font-weight:700;font-size:16px;margin-top:8px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(28px,7.5vw,36px);font-weight:700;color:var(--accent);margin:6px 0 12px;line-height:1.3;text-shadow:0 2px 0 #ffffff88}
p{font-family:"Nunito",system-ui,sans-serif;font-weight:600;color:var(--soft);font-size:19px;margin:0 0 20px;line-height:1.5}
.quote{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:24px;font-style:italic;color:var(--accent);line-height:1.5;margin:0 0 20px;animation:pop .6s}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px;flex-wrap:wrap}
button{font-family:"Nunito",system-ui,sans-serif;font-weight:800;font-size:19px;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;transition:transform .2s}
.yes{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px #e8386d66}
.yes:active{transform:scale(.95)}
.no{background:#fff;color:var(--accent);border:2px solid var(--accent2)}
.dots{margin-top:18px;font-size:20px;letter-spacing:6px}
.hide{display:none!important}
@media (min-width:700px){.card{min-height:min(820px,calc(100dvh - 32px));border:8px solid #2a0a18;border-radius:44px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 20px}
.grid .pol{width:100%;position:relative;cursor:pointer}
.grid .pol .q{position:absolute;inset:10px 10px 12px;background:#e8386dee;color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:8px;font-size:14px;font-style:italic;opacity:0;transition:opacity .3s;pointer-events:none}
.grid .pol.show .q{opacity:1}
.heart{position:fixed;bottom:-40px;z-index:1;animation:rise linear infinite;opacity:.7;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(30deg)}}
.pop{position:fixed;z-index:9;pointer-events:none;font-size:26px;animation:burst 1s forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.sign{margin-top:16px;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:22px;color:var(--accent)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="pol" id="pol"><img id="im" alt=""><span id="cap"></span></div>
  <h1 id="t"></h1>
  <p id="s"></p>
  <div class="quote hide" id="q"></div>
  <div class="grid hide" id="g"></div>
  <div class="btns" id="b">
    <button class="yes" id="y">Yes 💖</button>
    <button class="no" id="n">No</button>
  </div>
  <div class="btns hide" id="b2"><button class="yes" id="more">Another love note 💌</button></div>
  <div class="dots" id="d"></div>
  <div class="sign hide" id="sg">Forever yours, Abdul 💍</div>
</div>

const POS=["50% 40%","50% 35%","50% 45%","50% 25%"];
const steps=[
 {i:2,c:"Us, always",e:"💌",t:"My Dearest Jaanu 💕",s:"Urooba Tanveer, are you up for a long, wonderful day this coming Saturday with your future husband, Abdul Rehman Salim?",n:"Of all the places in the world, my favourite is wherever you are."},
 {i:0,c:"Our little adventures",e:"🏡",t:"First, a cosy day at TDF Ghar 🏡",s:"A cosy little trip to TDF Ghar first. Are you in?",n:"You turned my ordinary days into my favourite memories."},
 {i:1,c:"My forever partner",e:"🔬",t:"Then, science and you at Magnifiscience 🔬",s:"Next, we get curious together at Magnifiscience Centre, baby. Shall we?",n:"If love were a science, you would be my greatest discovery."},
 {i:3,c:"Dressed up for you",e:"🍽️",t:"Finally, a lunch fit for my queen 🍽️",s:"And to finish, a lovely fine dine lunch, just us two. Deal?",n:"With you, even a quiet Saturday feels like a celebration."}
];
const pool=["Every love story is beautiful, but ours is my favourite.","I fall for you a little more with every sunrise.","You are my today and all of my tomorrows.","Home is not a place for me anymore, baby. It’s you.","My heart does a little happy dance whenever your name pops up.","Choosing you is the easiest and best decision I will ever make.","I don’t need a perfect life, I just need you in it, always.","You make my heart smile in ways I can’t explain.","Whatever the future holds, I want to face it holding your hand.","Loving you feels like coming home and going on an adventure at once."];
const nos=["Nice try 😜","That button is shy 🙈","Not allowed, my love 💕","Too slow! 😘","Only Yes works here 💖"];
let i=0,tries=0,qi=0;
const $=id=>document.getElementById(id);
const y=$("y"),n=$("n");
function photo(k,c){$("im").src=IMG[k];$("im").style.objectPosition=POS[k];$("cap").textContent=c}
function ask(){
  const k=steps[i];
  photo(k.i,k.c);
  $("t").textContent=k.t;$("s").textContent=k.s;
  $("q").classList.add("hide");$("s").classList.remove("hide");$("b").classList.remove("hide");
  $("d").textContent="💗".repeat(i)+"🤍".repeat(steps.length-i);
  n.textContent="No";
}
function dodge(e){
  e.preventDefault();tries++;
  n.textContent=nos[tries%nos.length];
  n.style.position="fixed";
  const w=window.innerWidth-n.offsetWidth-20,h=window.innerHeight-n.offsetHeight-20;
  n.style.left=(10+Math.random()*w)+"px";n.style.top=(10+Math.random()*h)+"px";n.style.zIndex=5;
  y.style.transform="scale("+Math.min(1+tries*0.08,1.7)+")";
}
["pointerenter","pointerdown","click","touchstart"].forEach(ev=>n.addEventListener(ev,dodge,{passive:false}));
function burst(x,y2,c){
  for(let j=0;j<(c||7);j++){
    const h=document.createElement("div");h.className="pop";
    h.textContent=["💖","💗","💕","🌹","✨"][j%5];
    h.style.left=x+"px";h.style.top=y2+"px";
    h.style.setProperty("--dx",(Math.random()*160-80)+"px");
    h.style.setProperty("--dy",(-60-Math.random()*120)+"px");
    document.body.appendChild(h);setTimeout(()=>h.remove(),1000);
  }
}
y.addEventListener("click",e=>{
  burst(e.clientX,e.clientY,9);
  n.style.position="";n.style.left=n.style.top="";y.style.transform="";tries=0;
  // show love note
  $("b").classList.add("hide");$("s").classList.add("hide");
  $("t").textContent="You made my heart melt, honey 🥰";
  $("q").textContent="“"+steps[i].n+"”";
  $("q").classList.remove("hide");
  $("b2").classList.remove("hide");
  $("more").textContent=i<steps.length-1?"Next 💕":"See our surprise 💍";
  $("more").dataset.mode="next";
  document.querySelector(".quote").style.animation="none";void document.querySelector(".quote").offsetWidth;document.querySelector(".quote").style.animation="";
});
$("more").addEventListener("click",e=>{
  if($("more").dataset.mode==="next"){
    i++;
    if(i<steps.length){$("b2").classList.add("hide");ask();return;}
    finale();return;
  }
  burst(e.clientX,e.clientY,6);
  $("q").textContent="“"+pool[qi++%pool.length]+"”";
});
function finale(){
  $("pol").classList.add("hide");
  $("t").textContent="Saturday is ours, my love 💍";
  $("s").classList.remove("hide");
  $("s").textContent="TDF Ghar, then Magnifiscience Centre, then a fine dine lunch. Tap our photos, and tap anywhere for hearts. I love you, jaanu!";
  $("q").textContent="“"+pool[qi++%pool.length]+"”";
  $("g").classList.remove("hide");
  const caps=["You, me, and the sunshine ☀️","Our graduation night 🎓","Every moment with you 💞","My favourite person 💍"];
  const qs=["You are my favourite hello.","Proud of us, always.","I’d pick you in every lifetime.","My heart is yours, forever."];
  $("g").innerHTML=[0,1,2,3].map(k=>`<div class="pol"><img src="${IMG[k]}" alt="" style="object-position:${POS[k]}"><span>${caps[k]}</span><div class="q">${qs[k]}</div></div>`).join("");
  document.querySelectorAll("#g .pol").forEach(p=>p.addEventListener("click",()=>p.classList.toggle("show")));
  $("more").textContent="Another love note 💌";$("more").dataset.mode="shuffle";
  $("d").textContent="💗💗💗💗";$("sg").classList.remove("hide");
  document.addEventListener("pointerdown",e=>{if(!e.target.closest("button"))burst(e.clientX,e.clientY,5)});
  for(let j=0;j<25;j++)heart();
}
function heart(){
  const h=document.createElement("div");
  h.className="heart";h.textContent=["💖","💗","💕","🌹"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+"vw";h.style.fontSize=(16+Math.random()*28)+"px";
  h.style.animationDuration=(5+Math.random()*7)+"s";h.style.animationDelay=(Math.random()*3)+"s";
  document.body.appendChild(h);
}
for(let j=0;j<12;j++)heart();
ask();
</script>
